[project]
name = "curvature-transformer"


version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "einops>=0.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.11.9",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "jupyter>=1.1.1",
    "streamlit>=1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Rules to enable
# cf. https://beta.ruff.rs/docs/rules/
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "W",  # pycodestyle warning
]
# Rules to fix automatically
fixable = ["E", "F", "I"]
# Rules not to fix automatically
unfixable = ["W"]

[tool.mypy]
python_version = "3.12"
# Checks
warn_unreachable = true  # Warn about unreachable code
disallow_untyped_defs = true  # Disallow functions without type annotations
warn_return_any = true  # Warn when the return type is unknown
ignore_missing_imports = true  # Ignore third-party libraries
# Output
pretty = true
show_error_context = true

[tool.pytest]
minversion = "6.0"
addopts = "-svv --tb=short --capture=no --full-trace"
testpaths = ["tests/*"]

[tool.pytest.ini_options]
# importlib import mode
# cf. https://docs.pytest.org/en/latest/explanation/goodpractices.html#choosing-a-test-layout
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]
